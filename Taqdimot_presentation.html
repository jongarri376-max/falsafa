<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>G‘arb falsafasi — Prezentatsiya</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b12;color:#fff;font-family:Arial,Helvetica,sans-serif}
#stage{width:100vw;height:100vh;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;display:none;padding:7vh 8vw;
background:radial-gradient(circle at 20% 10%,#24314d 0,#111827 38%,#070a10 100%);
animation:in .28s ease}
.slide.active{display:block}
@keyframes in{from{opacity:.15;transform:scale(.985)}to{opacity:1;transform:scale(1)}}
.content{position:absolute;left:7%;top:9%;width:86%;height:78%;display:flex;flex-direction:column;justify-content:center}
.text{font-size:clamp(18px,2.2vw,34px);line-height:1.5;margin:10px 0;white-space:pre-wrap;max-width:1050px;text-shadow:0 2px 12px #000}
.text:first-child{font-size:clamp(30px,4vw,62px);font-weight:700;line-height:1.15}
.controls{position:absolute;left:0;right:0;bottom:0;height:72px;display:flex;align-items:center;justify-content:center;gap:12px;background:linear-gradient(transparent,rgba(0,0,0,.7));z-index:10}
button{border:1px solid #555;background:rgba(20,25,35,.8);color:#fff;border-radius:10px;padding:10px 18px;font-size:20px;cursor:pointer}
button:hover{background:#30394b}
#counter{min-width:90px;text-align:center;color:#bbb}
#hint{position:absolute;right:18px;top:16px;color:#aaa;font-size:13px;z-index:10}
#progress{position:absolute;left:0;top:0;height:4px;background:#fff;width:0;z-index:20;transition:width .2s}
@media(max-width:700px){.content{top:7%;height:82%}.text{font-size:18px}.text:first-child{font-size:30px}button{padding:8px 13px;font-size:18px}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="progress"></div>
<div id="hint">← →  •  Space  •  F = fullscreen  •  Esc = chiqish</div>
<div class="controls">
<button onclick="prev()">←</button>
<button onclick="next()">→</button>
<span id="counter"></span>
<button onclick="toggleFS()">⛶</button>
</div>
<script>
const data=[[{"text": "G’arb falsafasi", "x": 26.46551837270341, "y": 18.395100612423448, "w": 59.03646653543307, "h": 35.308603091280254}, {"text": "Tayyorladi: 26-2-gurux talabasi Hakimov Bunyod", "x": 28.544611220472444, "y": 56.10748031496063, "w": 59.03646653543307, "h": 20.493832020997374}], [{"text": "Mifologik dunyo qarashdan ilmiy dunyoqarashga o’tish-  FALES", "x": 5.625008202099738, "y": 8.88888888888889, "w": 83.09895833333333, "h": 21.234572761738114}, {"text": "7-6 asrlarda Fales falsafada katta o’zgarish qiladi. Tabiat hodisalarini xudolarning \n  xohish irodasi emas balki ilmiy sabablardan kelib chiqishini aytdi. Falaes butun \ndunyoning  asosi nimada degan savolni berdi va uning javobi - SUV", "x": 5.625008202099738, "y": 18.384033245844268, "w": 99.39148622047243, "h": 63.23191892680081}], [{"text": "Anaksimander- Aperion cheksiz bo’shliq\u000bAnaksimen- havo\u000bPifagor- sonlar\u000bgeraklit- olov\u000bEmpedokl- tabiatning asosi to’rt unsur\u000bdemokrit- Atomlar", "x": 11.562885498687663, "y": 18.701939340915718, "w": 86.61155675853018, "h": 74.49604841061533}], [{"text": "Sofistlar- Inson qanday yashashi kerak\u000bbilim nima,  Bilimga qanday erishamiz", "x": 5.625008202099738, "y": 8.88888888888889, "w": 83.09895833333333, "h": 21.234572761738114}, {"text": "Bu davrga suqrot katta hissa qo’shdi. Suqroq fikrni tabiatga emas, ko’proq insonning hayoti va axloqiga qaratdi. Suqrotdan keyin uning shogirdi Platon falsafani yangi bosqichga olib chiqdi, u ko’proq G’oyalar haqida gapirdi. Uning qarashicha go’yalardan iborat mukammal olam bor biz yqshab turgan dunyo o’sha \nDunyoning nomukammal shaklidir", "x": 5.625008202099738, "y": 31.234572761738118, "w": 83.09895833333333, "h": 53.209871682706336}], [], [{"text": "Stoitsizm\nStoitsizm — qadimgi Yunonistonda, miloddan avvalgi III asrda paydo bo‘lgan falsafiy ta’limot. Uning asosiy g‘oyasi — inson o‘z hayotida o‘z nazoratidagi narsalarga e’tibor berishi, nazorat qila olmaydigan narsalarni esa xotirjamlik bilan qabul qilishi kerak.", "x": 4.875, "y": 18.444444444444443, "w": 91.24999179790026, "h": 68.66666666666667}], [{"text": "Empirizm (yunoncha yetreta — tajriba) — falsafiy oqim; hissiy tajribani bilishning birdan-bir manbai deb hisoblaydi. Ratsionalizmga qarama-qarshi turadi. Tajribani, hissiy bilishni mutlaqlashtirish, ratsional bilish (tushunchalar, nazariyalar) ahamiyatini pasaytirish empirizmga xos jihatlardir.", "x": 5.625, "y": 12.222222222222221, "w": 83.0989747375328, "h": 75.55554097404492}], [{"text": "Ratsionalizm (lotincha rationalis - \"ong\") bilim faqat ong orqali aniqlanishi mumkin, deb hisoblaydigan epistemologik oqimdir. Ratsionalistlar haqiqat kriteriyini hissiyotlar emas, balki aql oʻrnatadi, deb uqtirishadi.", "x": 3.0, "y": 13.777777777777779, "w": 88.53645833333333, "h": 70.66665208515602}], [{"text": "Bilish nazariyasi (gnoseologiya, epistemologiya) — falsafa boʻlimidan biri boʻlib, u bilish qonuniyatlari va imkoniyatlari, bilimning obyektiv reallikka munosabatini oʻrganadi, bilish jarayonining bosqichlari va shakllarini, bilishning ishonchliligi va haqqoniyligi shartlari va mezonlarini tadqiq qiladi. Bilish nazariyasi hozirgi zamon fanida qoʻllaniladigan usullar (tajriba, modellashtirish, analiz, sintez va hokazo)ni umumlashtirib, uning falsafiy-metodologik asosi sifatida namoyon boʻladi. Bilish jarayonida tajriba va amaliyotning katta ahamiyati bor. Bu yerda amaliyot (praktika) keng maʼnoda boʻlib, insonning jamiyatga taʼsiri, tabiat hodisalarini oʻzgartirishi, yangi narsalar, jamiyatning yashashi uchun zaruriy shart-sharoitlar yaratishi tushuniladi. Kishilarning tabiat qonunlari haqidagi bilimiga asoslangan amaliy faoliyatlari bilish taraqqiyotini, fan va texnika ravnaqini belgilaydi.", "x": 3.1250082020997376, "y": 26.419743365412657, "w": 95.625, "h": 53.5802420530767}], [{"text": "Skeptitsizm (yun. skeptikos koʻrib chiquvchi, tadqiq qiluvchi) — haqiqatning biron ishonchli mezoni mavjudligiga shubha bilan qaraydigan falsafiy nuqtai nazar. Uning vakillari obyektiv voqelikni idrok qilish mumkinligiga shubha qiladilar. S antik jamiyat inqirozga yuz tutgan davrda yuzaga keldi. S.ning oʻta shakli agnostitsizmamr. Uning rivojlanishini 3 davrga ajratish mumkin: ilk S. (Pirron), Platon akademiyasi Si (Arkesilay, Karnead), soʻnggi davr S.i (Enesidem, Sekst Empirik va boshqalar). S.ning yirik namoyandalaridan boʻlgan D. Yum fikricha, garchi obyektiv reallik mavjud, degan ishonch kuchli boʻlsada, bu ishonchni na fan, na amaliyot tasdikladi. Yum tabiat va undagi xrdisalarni bilishda shubhalanadi. Uningcha, tabiat oʻz sirini odamlardan uzoqda tutadi. Yangi davr (XVI—XVIII asrlar)da S. hurfikrlilik, diniy va falsafiy aqidalarning tanqidi (M. Monten, P. Veyl va boshqalar) sinonimiga aylangan.", "x": 0.0, "y": 10.666666666666668, "w": 96.0, "h": 67.3086176727909}], []];
const stage=document.getElementById('stage');
const counter=document.getElementById('counter');
const progress=document.getElementById('progress');
let current=0;

data.forEach((items,i)=>{
  const s=document.createElement('section');
  s.className='slide';
  const c=document.createElement('div'); c.className='content';
  items.forEach((it,j)=>{
    const p=document.createElement('div'); p.className='text';
    p.textContent=it.text;
    if(j>0) p.style.fontSize='clamp(18px,2.0vw,31px)';
    c.appendChild(p);
  });
  s.appendChild(c); stage.appendChild(s);
});

function show(n){
  current=Math.max(0,Math.min(data.length-1,n));
  document.querySelectorAll('.slide').forEach((s,i)=>s.classList.toggle('active',i===current));
  counter.textContent=(current+1)+' / '+data.length;
  progress.style.width=((current+1)/data.length*100)+'%';
}
function next(){if(current<data.length-1)show(current+1)}
function prev(){if(current>0)show(current-1)}
function toggleFS(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
}
document.addEventListener('keydown',e=>{
  if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();next()}
  else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();prev()}
  else if(e.key.toLowerCase()==='f') toggleFS();
  else if(e.key==='Home') show(0);
  else if(e.key==='End') show(data.length-1);
});
let sx=0;
stage.addEventListener('touchstart',e=>sx=e.touches[0].clientX);
stage.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)(dx<0?next:prev)()});
show(0);
</script>
</body>
</html>
